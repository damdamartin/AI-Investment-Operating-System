name = "ai-investment-trading-cycle"
main = "src/workers/trading-cycle-worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ✅ Durable Object 내보내기 설정
[exports.RealtimeTradingAgent]
type = "durable-object"
storage = "sqlite"

[env.production]
vars = { ENVIRONMENT = "production", CLOUDFLARE_ACCOUNT_ID = "87b29e119026eda88a305476a9c28adb", CLOUDFLARE_D1_DATABASE_ID = "9d287512-e226-4d7f-b739-d54098b36e0d", TOSS_CLIENT_ID = "tsck_live_xOGg7QZbI1Im34ldMpal9D", TOSS_CLIENT_SECRET = "tssk_live_L33b3zbjbfYaLBxlqnvYVpG9QWJtIetvkeJ4ZmK6cctA", TOSS_ACCOUNT_REF = "1", ALPACA_API_KEY = "", ALPACA_SECRET_KEY = "", ALPACA_BASE_URL = "https://api.alpaca.markets" }

# ✅ Durable Object 바인딩 (production 환경)
# KIS 에이전트 (한투) - LIVE TRADING
[[env.production.durable_objects.bindings]]
name = "REALTIME_TRADING_AGENT_KIS"
class_name = "RealtimeTradingAgent"

# ✅ Toss 에이전트 활성화 (메모리에서 API 정보 복구)
[[env.production.durable_objects.bindings]]
name = "REALTIME_TRADING_AGENT_TOSS"
class_name = "RealtimeTradingAgent"

# ✅ Durable Object 마이그레이션
[[env.production.durable_objects.migrations]]
tag = "v1"
new_classes = ["RealtimeTradingAgent"]

[[env.production.d1_databases]]
binding = "DB"
database_id = "9d287512-e226-4d7f-b739-d54098b36e0d"
preview_database_id = "9d287512-e226-4d7f-b739-d54098b36e0d"

# ✅ Cron 트리거 (KIS 거래 활성화용)
# - 1분마다 Durable Object 활성화 (setInterval 지속)
# - Durable Object는 1분 동안 폴링/신호생성/모니터링
[[env.production.triggers.crons]]
crons = ["*/1 * * * *"]  # 매 1분마다 실행
