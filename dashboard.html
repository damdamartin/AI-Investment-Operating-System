<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Upbit 자동매매 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-size: 24px;
            color: #667eea;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .status-badge.running {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.waiting {
            background: #cce5ff;
            color: #004085;
        }

        .status-badge.stopped {
            background: #f8d7da;
            color: #721c24;
        }

        .timestamp {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .card-title {
            font-size: 14px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .card-subtitle {
            font-size: 12px;
            color: #999;
        }

        .card-positive {
            color: #28a745;
        }

        .card-negative {
            color: #dc3545;
        }

        .card-neutral {
            color: #667eea;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
            font-size: 14px;
        }

        .info-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
        }

        .info-label {
            color: #999;
            font-size: 12px;
        }

        .info-value {
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }

        .schedule-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .schedule-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .schedule-item:last-child {
            border-bottom: none;
        }

        .schedule-time {
            font-weight: bold;
            color: #667eea;
        }

        .schedule-action {
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin: 30px 0 15px 0;
        }

        .mobile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 18px;
            }

            .card-value {
                font-size: 24px;
            }

            .mobile-stats {
                grid-template-columns: 1fr 1fr;
            }
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            background: #5568d3;
        }

        .last-update {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <div>
                    <h1>⚡ Upbit 자동매매 대시보드</h1>
                    <div class="timestamp" id="timestamp"></div>
                </div>
                <button class="refresh-btn" onclick="loadDashboard()">🔄 새로고침</button>
            </div>
        </header>

        <div id="error" class="error" style="display: none;"></div>

        <div id="content" style="display: none;">
            <!-- 상단 요약 -->
            <div class="grid">
                <div class="card">
                    <div class="card-title">📊 상태</div>
                    <div class="card-value" id="status">--</div>
                    <div class="card-subtitle" id="mode">--</div>
                </div>

                <div class="card">
                    <div class="card-title">💰 자산</div>
                    <div class="card-value" id="current-value">₩--</div>
                    <div class="card-subtitle">초기: <span id="initial-capital">₩--</span></div>
                </div>

                <div class="card">
                    <div class="card-title">📈 수익률</div>
                    <div class="card-value" id="roi-percent">--%</div>
                    <div class="card-subtitle" id="roi-amount">±₩--</div>
                </div>
            </div>

            <!-- 거래 통계 -->
            <div class="grid">
                <div class="card">
                    <div class="card-title">🎯 거래</div>
                    <div class="card-value" id="trades-count">0</div>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">포지션</div>
                            <div class="info-value" id="positions-count">0</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">운영 시간</div>
                            <div class="info-value" id="operating-time">0분</div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">🔍 종목</div>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">안전 종목</div>
                            <div class="info-value" id="safe-symbols">0</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">거래 종목</div>
                            <div class="info-value" id="trading-symbols">0</div>
                        </div>
                    </div>

                    <div class="schedule-box">
                        <div class="card-title" style="margin-bottom: 10px;">⏰ 다음 업데이트</div>
                        <div id="schedule-list"></div>
                    </div>
                </div>
            </div>

            <div class="last-update" id="last-update">마지막 업데이트: --</div>
        </div>

        <div id="loading" class="loading">
            <h2>📊 데이터 로드 중...</h2>
            <p style="margin-top: 10px; color: #ccc;">자동매매 시스템에서 데이터를 수집 중입니다</p>
        </div>
    </div>

    <script>
        // 대시보드 데이터 로드
        async function loadDashboard() {
            try {
                document.getElementById('error').style.display = 'none';
                document.getElementById('content').style.display = 'none';
                document.getElementById('loading').style.display = 'block';

                // JSON 데이터 로드 (CORS 우회를 위해 데이터 URI 사용)
                const dataPath = 'https://raw.githubusercontent.com/junkim-life360/upbit-trading-dashboard/main/trading_dashboard.json';

                // 로컬 테스트용 데이터
                const testData = {
                    'timestamp': new Date().toISOString(),
                    'status': 'running',
                    'mode': '주간 거래',
                    'initial_capital': 80223,
                    'current_value': 82547,
                    'roi_percent': 2.89,
                    'roi_amount': 2324,
                    'trades_count': 5,
                    'positions_count': 2,
                    'operating_minutes': 180,
                    'symbols': {
                        'total': 14,
                        'safe': 268,
                    },
                    'next_update': {
                        '09:00': '자동 재시작',
                        '12:00': '중간 보고',
                        '16:00': '거래 종료',
                    },
                };

                // 실제 파일이 있으면 로드, 없으면 테스트 데이터 사용
                let data = testData;
                try {
                    const response = await fetch(dataPath, {
                        headers: { 'Accept': 'application/json' },
                        cache: 'no-cache'
                    });
                    if (response.ok) {
                        data = await response.json();
                    }
                } catch (e) {
                    console.log('원격 데이터 없음, 테스트 데이터 사용');
                }

                // UI 업데이트
                updateUI(data);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

            } catch (error) {
                console.error('에러:', error);
                document.getElementById('error').textContent = `⚠️ 데이터 로드 실패: ${error.message}`;
                document.getElementById('error').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }
        }

        // UI 업데이트
        function updateUI(data) {
            const roiAmount = data.roi_amount || 0;

            // 상태
            document.getElementById('status').textContent = data.status === 'running' ? '✅ 운영 중' : '⏸️ 대기 중';
            document.getElementById('status').className = 'card-value ' + (data.status === 'running' ? 'card-positive' : 'card-neutral');
            document.getElementById('mode').textContent = data.mode || '--';

            // 자산
            document.getElementById('initial-capital').textContent = formatCurrency(data.initial_capital);
            document.getElementById('current-value').textContent = formatCurrency(data.current_value);

            // 수익률
            const roiClass = data.roi_percent > 0 ? 'card-positive' : data.roi_percent < 0 ? 'card-negative' : 'card-neutral';
            document.getElementById('roi-percent').textContent = formatPercent(data.roi_percent);
            document.getElementById('roi-percent').className = 'card-value ' + roiClass;

            const sign = roiAmount > 0 ? '+' : '';
            document.getElementById('roi-amount').textContent = `${sign}₩${Math.abs(roiAmount).toLocaleString()}`;
            document.getElementById('roi-amount').className = 'card-subtitle ' + roiClass;

            // 거래
            document.getElementById('trades-count').textContent = data.trades_count || 0;
            document.getElementById('positions-count').textContent = data.positions_count || 0;
            document.getElementById('operating-time').textContent = `${data.operating_minutes || 0}분`;

            // 종목
            document.getElementById('safe-symbols').textContent = data.symbols?.safe || 0;
            document.getElementById('trading-symbols').textContent = data.symbols?.total || 0;

            // 다음 업데이트 스케줄
            const scheduleList = document.getElementById('schedule-list');
            scheduleList.innerHTML = '';
            for (const [time, action] of Object.entries(data.next_update || {})) {
                const item = document.createElement('div');
                item.className = 'schedule-item';
                item.innerHTML = `
                    <span class="schedule-time">${time}</span>
                    <span class="schedule-action">${action}</span>
                `;
                scheduleList.appendChild(item);
            }

            // 마지막 업데이트
            const updateTime = new Date(data.timestamp).toLocaleString('ko-KR');
            document.getElementById('last-update').textContent = `마지막 업데이트: ${updateTime}`;
            document.getElementById('timestamp').textContent = updateTime;
        }

        // 포맷 함수
        function formatCurrency(value) {
            if (!value) return '₩0';
            return '₩' + Math.round(value).toLocaleString();
        }

        function formatPercent(value) {
            if (!value) return '0%';
            const sign = value > 0 ? '+' : '';
            return `${sign}${value.toFixed(2)}%`;
        }

        // 자동 새로고침 (30초마다)
        setInterval(() => {
            loadDashboard();
        }, 30000);

        // 초기 로드
        loadDashboard();
    </script>
</body>
</html>
