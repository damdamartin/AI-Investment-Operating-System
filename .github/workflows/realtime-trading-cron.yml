name: Realtime Trading Cron

on:
  schedule:
    # 매 1분마다 실행 (UTC)
    - cron: '* * * * *'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  run-trading-cycle:
    runs-on: ubuntu-latest
    name: KIS + Toss Trading Cycle

    steps:
      - name: Run KIS Auto Trading
        run: |
          echo "🚀 [$(date -u '+%Y-%m-%d %H:%M:%S UTC')] KIS 거래 사이클 시작"
          curl -s -X POST \
            "https://ai-investment-trading-cycle-production.junkim-life360.workers.dev/api/run-kis-trading" \
            -H "Content-Type: application/json" \
            | jq '.'
        continue-on-error: true

      - name: Run Toss Auto Trading
        run: |
          echo "🚀 [$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Toss 거래 사이클 시작"
          curl -s -X POST \
            "https://ai-investment-trading-cycle-production.junkim-life360.workers.dev/api/run-toss-trading" \
            -H "Content-Type: application/json" \
            | jq '.'
        continue-on-error: true

      - name: Verify Dashboard Status
        run: |
          echo "✅ [$(date -u '+%Y-%m-%d %H:%M:%S UTC')] 대시보드 상태 확인"
          curl -s "https://ai-investment-trading-cycle-production.junkim-life360.workers.dev/api/dashboard" \
            | jq '.systemStatus, .portfolio'
        continue-on-error: true
